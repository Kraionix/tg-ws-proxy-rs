[package]
name = "logreel"
description = "Typed, allocation-free event logging with append-only segment files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
text = ["logreel-core/text"]
ring = ["logreel-core/ring"]
file = ["dep:logreel-file"]
zstd = ["file", "logreel-file/zstd"]

[dependencies]
logreel-core.workspace = true
logreel-derive.workspace = true
logreel-file = { workspace = true, optional = true }

[lints]
workspace = true
