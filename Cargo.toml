[package]
name = "tg-ws-proxy-rs"
version = "2.6.0"
edition = "2024"
description = "Telegram MTProto WebSocket Bridge Proxy — Rust port of Flowseal/tg-ws-proxy"
license = "MIT"
readme = "README.md"
repository = "https://github.com/valnesfjord/tg-ws-proxy-rs"
homepage = "https://github.com/valnesfjord/tg-ws-proxy-rs"
documentation = "https://docs.rs/tg-ws-proxy-rs"
keywords = ["telegram", "mtproto", "websocket", "proxy", "rust"]
categories = ["network-programming", "command-line-utilities"]

[package.metadata.android]
# This must match (MAJOR * 10000 + MINOR * 100 + PATCH) * 10.
version_code = 206000

# The JNI shim is a separate crate because `crate-type` is a per-package
# setting: a `["lib", "cdylib"]` root made every desktop and Docker
# `cargo build` additionally link an .so nobody loads. `default-members` keeps
# the root package the only thing a bare build/test/clippy touches; the Android
# Gradle task asks for the shim by name with `-p`.
[workspace]
members = ["crates/android-jni"]
default-members = ["."]

[[bin]]
name = "tg-ws-proxy"
path = "src/main.rs"

[features]
# The structured log is always compiled in, and the record pipeline always
# runs: the text log is a projection of it, and the `SIGUSR1` ring is the
# other consumer. The on-disk sink — redb day segments, the `--log-dir` flag
# family, the `--log-level`/`--log-category` thresholds that only it reads, and
# the `probe-segment`/`dump-segment` reader verbs — is the one part behind a
# feature: it is off by default, and an embedder that only wants the text log
# should not link a storage engine it never opens. See `redb` below.
default = []
log-disk = ["dep:redb"]
# Compression for the segments the disk sink writes, so it cannot stand
# without it: `log-zstd` implies `log-disk`. See the `zstd` dependency below.
log-zstd = ["log-disk", "dep:zstd"]

[dependencies]
# Async runtime
# Only the features actually reached from src/ and tests/. `full` additionally
# pulls in fs/process/signal; LTO strips the unused code either way (~16 KB), so
# this is about the dependency tree, not the binary — it drops parking_lot,
# signal-hook-registry and six more transitive crates.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    # `SIGTERM`/`SIGINT` for the binary: a stop has to reach a clean shutdown so
    # the log sink is committed on the way out (see `main.rs`).
    "signal",
] }

# WebSocket protocol with TLS support
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
    "handshake",
] }
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
] }

# AES-256-CTR encryption for MTProto obfuscation
aes = "0.8"
ctr = "0.9"
cipher = "0.4"

# SHA-256 for MTProto key derivation
sha2 = "0.10"

# HMAC-SHA256 for FakeTLS upstream proxy authentication
hmac = "0.12"

# Random bytes for handshake generation
rand = "0.9"

# Hex encoding / decoding utilities
hex = "0.4"

# CLI argument parsing (with env-variable fallback)
clap = { version = "4", features = ["derive", "env"] }

# Proxy URL parsing and proxy protocol clients
url = "2"
percent-encoding = "2"
ipnet = "2"
httparse = "1"
async-http-proxy = { version = "1.2", features = [
    "runtime-tokio",
    "basic-auth",
] }
tokio-socks = "0.5"

# Other crates' logging: `rustls` and `tungstenite` narrate their handshakes
# through `tracing`, and this process prints those lines — prefixed, and off
# unless `RUST_LOG` asks for them. This crate's own output is a record
# (`src/log/`) or a `tg-ws-proxy:` line, neither of which goes through here.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Structured event log. The record schema is hand-written against the `.proto`
# in artifacts/logging/10_SCHEMA.md, so the derive is all that is needed —
# there is no protoc and no build.rs in this crate.
prost = "0.14"

# Day-segment storage: an embedded key-value store with typed keys and
# per-transaction durability. Pure Rust, which is the point — every release
# target cross-compiles, and a C storage engine would need a C toolchain for
# each one. Optional: it is linked only by builds with `log-disk`, and in a
# build without it `--log-dir` and the reader verbs do not exist at all.
redb = { version = "4.3", optional = true }
# Optional per-batch compression of stored batches (`--log-compress=zstd-l1`).
# Off by default: the codec is ~500 KB of the release binary and the default
# mode stores batches as they are, so a build that never compresses should not
# carry it. `cargo build --features log-zstd` puts the mode back; a segment
# written with it is readable only by a build that has it.
zstd = { version = "0.14", optional = true }

# Async stream utilities (SinkExt, StreamExt)
futures-util = "0.3"

# Custom TLS configuration (skip-verify option)
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
# Bundled Mozilla root cert store (used by the default TLS connector)
webpki-roots = "0.26"
# Async TLS streams (transitive dep of tokio-tungstenite; used for HTTPS GET in default_domains)
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

# Naming the log directory's filesystem on macOS needs `statfs`: Linux reads
# `/proc/self/mountinfo`, and Windows has no such gate. Scoped to that target so
# no other build links it.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.12"
# The segment reader prints JSON Lines, and a test that reads its own output
# back with the format's own parser is worth more than one that greps it. Test
# only: nothing here is linked into the binary that ships.
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Debug and test builds are the ones that fill a disk. Cargo's defaults put full
# DWARF into every crate of the graph, dependency chains included, and keep a
# second copy of each in the incremental cache: measured on this tree, one
# `cargo test --no-run` costs 3.0 GB (2.0 GB in `debug/deps`, 795 MB in
# `debug/incremental`). Multiplied by the cross targets this project builds for,
# that is the difference between a few gigabytes and fifty.
#
# `line-tables-only` keeps file:line in a backtrace for our own code, which is
# what debugging this proxy actually uses; a dependency is not where a bug gets
# read from, so it carries no debug info at all. Incremental is off because its
# cache duplicates the crate graph — the largest single directory under
# `target/` — to speed up rebuilds this project does not make often enough to
# pay for it.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# `test` inherits `dev`, but spelled out: an edit to one profile should not be
# able to leave the other quietly on the old defaults.
[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false
